# Example: reverse-proxy OpenClaw (HTTP on port 80 → 127.0.0.1:18789).
# Hostname: openclaw.danish-freez.ip-ddns.com (add A record → this server).
# Install: sudo cp scripts/nginx-openclaw-danish-freez.conf /etc/nginx/sites-available/openclaw
# TLS:     sudo certbot --nginx -d openclaw.danish-freez.ip-ddns.com
#
# Gateway: openclaw config set gateway.bind loopback

server {
    listen 80;
    listen [::]:80;
    server_name openclaw.danish-freez.ip-ddns.com;

    location / {
        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
